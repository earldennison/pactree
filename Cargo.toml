[package]
name = "pactree"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Deterministic context trees for AI agents and applications."
license = "MIT"
repository = "https://github.com/earldennison/pactree"
documentation = "https://docs.rs/pactree"
readme = "README.md"
keywords = ["context", "tree", "agent", "pactree"]
categories = ["data-structures"]
include = [
    "src/**",
    "tests/**",
    "benches/**",
    "tools/pact-v01-convert/**",
    "examples/**",
    "api/**",
    "contracts/**",
    "release/tool-versions.toml",
    "/docs/internals/adapter-boundaries.md",
    "/docs/reference/file-format.md",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
    "/CHANGELOG.md",
]

[lib]
name = "pactree"
path = "src/lib.rs"

[[bin]]
name = "pactree"
path = "src/main.rs"

[[bin]]
name = "pact-v01-convert"
path = "tools/pact-v01-convert/main.rs"

[[bench]]
name = "v01_storage"
harness = false

[[bench]]
name = "storage_phases"
harness = false

[dependencies]
blake3 = "1"
clap = { version = "4.5", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
flate2 = "1"
getrandom = "0.3"
memmap2 = "0.9"
tiktoken-rs = "0.11"
tempfile = "3"
zstd = "0.14.3"

[features]
default = ["compression-zstd"]
compression-zstd = []

# Clippy is part of the contract: the engine builds clean under
# `cargo clippy --all-targets -- -D warnings`. Denying `all` here makes any new
# clippy warning a hard error under clippy (build/test are unaffected — clippy
# lints only fire under `cargo clippy`). Narrow, justified `#[allow(...)]` are
# used at the few wide internal helpers.
[lints.clippy]
all = "deny"
