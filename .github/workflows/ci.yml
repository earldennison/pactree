name: Pactree CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  test-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: bash scripts/check-test-layout.sh

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with: {components: rustfmt}
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy-${{ matrix.features }}
    runs-on: ubuntu-latest
    strategy:
      matrix: {features: [all-features, no-default-features]}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
        with: {components: clippy}
      - uses: Swatinem/rust-cache@v2
        with: {key: "clippy-${{ matrix.features }}"}
      - run: cargo clippy --locked --all-targets --${{ matrix.features }} -- -D warnings

  test-msrv-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with: {key: msrv-all-features}
      - run: rustup toolchain install nightly-2026-05-31 --profile minimal
      - run: cargo +nightly-2026-05-31 install cargo-public-api --version 0.52.0 --locked
      - run: cargo +1.93.0 test --locked --all-targets --all-features

  test-stable:
    name: test-stable-${{ matrix.os }}
    strategy:
      matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {key: "stable-all-${{ matrix.os }}"}
      - run: rustup toolchain install nightly-2026-05-31 --profile minimal
      - run: cargo +nightly-2026-05-31 install cargo-public-api --version 0.52.0 --locked
      - run: cargo +stable test --locked --all-targets --all-features

  test-no-default:
    name: test-no-default-${{ matrix.os }}
    strategy:
      matrix: {os: [ubuntu-latest, macos-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: {key: "stable-none-${{ matrix.os }}"}
      - run: rustup toolchain install nightly-2026-05-31 --profile minimal
      - run: cargo +nightly-2026-05-31 install cargo-public-api --version 0.52.0 --locked
      - run: cargo +stable test --locked --all-targets --no-default-features

  docs:
    runs-on: ubuntu-latest
    env: {RUSTDOCFLAGS: "-D warnings"}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: cargo doc --locked --no-deps --all-features
      - run: cargo test --locked --doc

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with: {command: check advisories bans licenses sources}

  public-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-31
      - run: cargo +nightly-2026-05-31 install cargo-public-api --version 0.52.0 --locked
      - run: cargo +nightly-2026-05-31 public-api --all-features --simplified --color never > /tmp/public-api.txt
      - run: diff -u api/pactree-0.1.0.txt /tmp/public-api.txt

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: bash scripts/check-package.sh

  malformed-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: cargo test --locked --test malformed_public_inputs --all-features
      - run: python3 scripts/audit_panic_surface.py

  storage-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: cargo test --locked --test storage_differential

  performance-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.93.0
      - run: cargo test --locked pact_file::log::tests::commit_reads_header_latest_transaction_and_index_paths_not_full_history
      - run: cargo test --locked pact_file::stream
